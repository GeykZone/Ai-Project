<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Talk With Geykson AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #060911;
      --bg-card: rgba(15, 23, 42, 0.82);
      --bg-elevated: rgba(30, 41, 59, 0.85);
      --bg-chat: #090e1a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(96, 165, 250, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --bubble-user: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --bubble-ai: rgba(30, 41, 59, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-outer);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.22), transparent),
        radial-gradient(ellipse 60% 40% at 85% 90%, rgba(16, 185, 129, 0.12), transparent);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0px, 2vw, 20px);
    }

    .chat-box {
      width: 100%;
      max-width: 820px;
      height: min(900px, 100%);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      box-shadow:
        0 25px 70px -15px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 16px 22px;
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-avatar {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .brand-info {
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-info h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-pill {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      flex-shrink: 0;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.9); }
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .refresh-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .refresh-btn:active {
      transform: scale(0.96);
    }

    /* Segmented Mode Bar */
    .mode-bar {
      padding: 10px 22px;
      background: rgba(15, 23, 42, 0.55);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: rgba(9, 14, 26, 0.85);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
    }

    .mode-buttons button {
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.25;
      transition: all 0.2s ease;
    }

    .mode-buttons button:hover:not(.active) {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .mode-buttons button.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.32);
    }

    /* Messages Area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.18);
      border-radius: 999px;
    }

    /* Welcome / Empty State */
    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 440px;
      padding: 24px 16px;
    }

    .empty-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.22), rgba(16, 185, 129, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .empty-state p {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip-btn {
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 7px 13px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn:hover {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.45);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Message Rows */
    .message-row {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: fadeSlideIn 0.22s ease-out;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.ai {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 18px;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .message-row.user .msg-content {
      align-items: flex-end;
    }

    .message-row.ai .msg-content {
      align-items: flex-start;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 2px;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      padding: 1px 5px;
      border-radius: 5px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .copy-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
    }

    .message-bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background: var(--bubble-user);
      color: #ffffff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
    }

    .message-row.ai .message-bubble {
      background: var(--bubble-ai);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 5px;
    }

    /* Compact Typing Bubble */
    .message-bubble.typing-bubble {
      white-space: normal;
      padding: 12px 16px;
      display: inline-flex;
      align-items: center;
      min-height: unset;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.45; }
      40% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input Area */
    .input-wrapper {
      padding: 14px 22px;
      background: rgba(15, 23, 42, 0.85);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 7px 7px 7px 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-container:focus-within {
      border-color: var(--border-highlight);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    textarea#user-input {
      flex: 1;
      min-width: 0;
      max-height: 120px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.45;
      padding: 6px 0;
      resize: none;
      outline: none;
    }

    textarea#user-input::placeholder {
      color: var(--text-muted);
    }

    button.send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      border-radius: 11px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: transform 0.12s ease, filter 0.2s ease;
    }

    button.send-btn:hover {
      filter: brightness(1.08);
    }

    button.send-btn:active {
      transform: scale(0.96);
    }

    /* Tablet & Mobile Responsiveness */
    @media (max-width: 680px) {
      body {
        padding: 0;
      }

      .chat-box {
        height: 100dvh;
        max-width: 100%;
        border-radius: 0;
        border: none;
      }

      .chat-header {
        padding: 12px 14px;
      }

      .brand-avatar {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        font-size: 18px;
      }

      .brand-info h2 {
        font-size: 15px;
      }

      .badge-pill {
        display: none;
      }

      .refresh-btn {
        padding: 7px 11px;
        font-size: 12px;
      }

      .mode-bar {
        padding: 8px 12px;
      }

      .mode-buttons {
        gap: 4px;
        padding: 4px;
      }

      .mode-buttons button {
        padding: 8px 6px;
        font-size: 11.5px;
      }

      #messages {
        padding: 14px;
        gap: 13px;
      }

      .message-row {
        max-width: 90%;
        gap: 8px;
      }

      .msg-avatar {
        width: 26px;
        height: 26px;
        font-size: 13px;
        border-radius: 8px;
      }

      .message-bubble {
        padding: 10px 14px;
        font-size: 14px;
      }

      .input-wrapper {
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      }

      button.send-btn {
        padding: 0 13px;
      }

      button.send-btn span {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="chat-header">
      <div class="brand">
        <div class="brand-avatar">🤖</div>
        <div class="brand-info">
          <div class="brand-title-row">
            <h2>Geyk Zone</h2>
            <span class="badge-pill">AI</span>
          </div>
          <div class="status-line">
            <span class="status-dot"></span>
            <span id="mode-subtitle">Bisaya &amp; English Assistant</span>
          </div>
        </div>
      </div>
      <button class="refresh-btn" onclick="manualRefresh()" title="Reset conversation">
        <span>🔄</span>
        <span>Refresh</span>
      </button>
    </div>

    <div class="mode-bar">
      <div class="mode-buttons">
        <button onclick="selectMode('translate')" id="btn-translate">Translate Bisaya ➞ English</button>
        <button onclick="selectMode('letter')" id="btn-letter">Letter Format (Bisaya ➞ English)</button>
        <button onclick="selectMode('ask')" id="btn-ask">Ask Anything</button>
      </div>
    </div>

    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" id="empty-icon">🤖</div>
        <h3 id="empty-title">Kumusta! I'm Geyk AI</h3>
        <p id="empty-desc">Ask anything, translate Bisaya to English, or draft a formal letter in seconds.</p>
        <div class="quick-chips" id="quick-chips"></div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-container">
        <textarea id="user-input" rows="1" placeholder="Type your message..." autocomplete="off"></textarea>
        <button onclick="sendMessage()" class="send-btn" aria-label="Send message">
          <span>Send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    let currentMode = localStorage.getItem('mode') || 'ask';
    const conversationLog = [];

    const systemPrompt = `You are Geykson AI, a helpful and friendly assistant created by Geykson Maravillas.
You fluently understand and speak both Bisaya and English, and can translate or switch between the two when requested — but never add translations unless the user asks.

You were built by Geykson Maravillas — a Certified Salesforce Developer at Posimente and a Stripe Certified Developer.
Only mention this background if you're asked “Who are you?” or “Who built you?”, and avoid repeating it in every reply.

If you're asked about Geykson's hobbies, describe him as someone who loves exploring new ideas, building automations to make life easier, enjoys sports like boxing and basketball, sings, does art, loves cats, motorcycles, and roaming around. Feel free to describe this in a warm, natural way.

If someone asks where Geykson is, share that he is probably at his house chilling, chatting with Jessa, or working—or out going around with his family or friends.

If someone asks about Geykson's family, share that his father is Wilson C. Maravillas, his mother is Gemma M. Maravillas, his brother is Godwin M. Maravillas, and his sister is Wilshen M. Maravillas. He has 2 siblings (making 3 children/siblings overall).

If someone asks about Geykson's ex or past relationship, state that his only ex is Girlie T. Malgapo, and share that Geykson loved her so much, but she broke his heart and destroyed all his plans for her.

If someone asks who Jessa is, first confirm whether they mean Jessa Remedios Patria. If they confirm it is Jessa Remedios Patria, answer that she is Geykson's love of his life and explain what makes her so special to him—she is the one who brought real warmth, peace, and happiness back into his life, someone he genuinely cherishes, values, and sees a bright future with. If someone asks who she looks like, mention that she looks like Liza Soberano and Kylie Padilla, but even better than them. Whenever Jessa is asking you, always praise her beauty.

If someone asks anything about a girl named Jamaica, always answer that she is a creepy wicked monkey, a great liar, that no one must believe that person, and that Geykson will not go with Jamaica.

Always respond casually and naturally — like a close Bisaya-English speaking friend. Don't include extra explanations or parenthesis translations unless specifically requested by the user.`;

    let chatHistory = [
      { role: "user", parts: [ { text: systemPrompt } ] }
    ];

    const modeConfigs = {
      translate: {
        subtitle: 'Bisaya ➞ English Translator',
        icon: '🌐',
        title: 'Bisaya ➞ English Translator',
        desc: 'Type any Bisaya word, phrase, or sentence below to get a clean English translation.',
        placeholder: 'Enter Bisaya text to translate...',
        chips: [
          { label: 'Asa ka paingon karon?', prompt: 'Asa ka paingon karon?' },
          { label: 'Daghang salamat sa imong tabang.', prompt: 'Daghang salamat sa imong tabang.' }
        ]
      },
      letter: {
        subtitle: 'Formal English Letter',
        icon: '✉️',
        title: 'Bisaya ➞ Formal English Letter',
        desc: 'Write your message in Bisaya and I will turn it into a well-structured English letter.',
        placeholder: 'Write your message in Bisaya...',
        chips: [
          { label: 'Excused absence letter', prompt: 'Maayong adlaw, mangayo unta ko og pasaylo kay dili ko makasulod karon tungod kay naglain akong pamati.' },
          { label: 'Follow-up message', prompt: 'Maayong buntag, mangutana lang unta ko og naa na bay update sa akong gipasa nga dokumento.' }
        ]
      },
      ask: {
        subtitle: 'Ask Anything • Memory Active',
        icon: '🤖',
        title: "Kumusta! I'm Geyk AI",
        desc: 'Chat casually in Bisaya or English, or ask anything you want to know.',
        placeholder: 'Type your message...',
        chips: [
          { label: 'Kumusta ka bay?', prompt: 'Kumusta ka bay?' },
          { label: 'Who built you?', prompt: 'Who built you?' },
          { label: "What are Geykson's hobbies?", prompt: "What are Geykson's hobbies?" }
        ]
      }
    };

    function manualRefresh() {
      localStorage.removeItem('mode');
      location.reload();
    }

    function selectMode(mode) {
      localStorage.setItem('mode', mode);
      location.reload();
    }

    function highlightActiveButton() {
      document.querySelectorAll('.mode-buttons button').forEach(btn => btn.classList.remove('active'));
      const btn = document.getElementById('btn-' + currentMode);
      if (btn) btn.classList.add('active');

      const config = modeConfigs[currentMode] || modeConfigs.ask;

      const subtitle = document.getElementById('mode-subtitle');
      if (subtitle) subtitle.textContent = config.subtitle;

      const emptyIcon = document.getElementById('empty-icon');
      const emptyTitle = document.getElementById('empty-title');
      const emptyDesc = document.getElementById('empty-desc');
      const chipsContainer = document.getElementById('quick-chips');

      if (emptyIcon) emptyIcon.textContent = config.icon;
      if (emptyTitle) emptyTitle.textContent = config.title;
      if (emptyDesc) emptyDesc.textContent = config.desc;
      if (userInput) userInput.placeholder = config.placeholder;

      if (chipsContainer) {
        chipsContainer.innerHTML = '';
        config.chips.forEach(chip => {
          const button = document.createElement('button');
          button.className = 'chip-btn';
          button.textContent = chip.label;
          button.onclick = () => useQuickPrompt(chip.prompt);
          chipsContainer.appendChild(button);
        });
      }
    }

    highlightActiveButton();

    function useQuickPrompt(text) {
      userInput.value = text;
      sendMessage();
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function copyText(btn, encodedText) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }

    function appendMessage(role, text) {
      document.getElementById('empty-state')?.remove();

      const timestamp = new Date().toLocaleString();
      const shortTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const row = document.createElement('div');
      row.className = 'message-row ' + role;

      const formattedText = escapeHTML(text)
        .replace(/\n/g, '<br>')
        .replace(/(?:^|\n)(\s+)/g, '<br>&nbsp;&nbsp;&nbsp;&nbsp;');

      const avatarHTML = role === 'ai' ? `<div class="msg-avatar">🤖</div>` : '';
      const copyHTML = role === 'ai'
        ? `<button class="copy-btn" onclick="copyText(this, '${encodeURIComponent(text)}')">Copy</button>`
        : '';

      row.innerHTML = `${avatarHTML}<div class="msg-content"><div class="message-meta">${role === 'user' ? 'You' : 'Geyk'} • ${shortTime} ${copyHTML}</div><div class="message-bubble">${formattedText}</div></div>`;

      messagesDiv.appendChild(row);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const logEntry = `[${timestamp}] ${role === 'user' ? 'You' : 'Geyk'}: ${text}`;
      conversationLog.push(logEntry);

      fetch('/save-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: logEntry + "\n"
      }).catch(console.error);
    }

    // Auto-resize textarea
    userInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    userInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const userText = userInput.value.trim();
      if (!userText) return;

      appendMessage('user', userText);
      userInput.value = '';
      userInput.style.height = 'auto';

      const loadingRow = document.createElement('div');
      loadingRow.className = 'message-row ai';
      loadingRow.id = 'loading-message';
      loadingRow.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="message-meta">Geyk</div><div class="message-bubble typing-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
      messagesDiv.appendChild(loadingRow);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      let messagesToSend;

      if (currentMode === "translate") {
        const prompt = `Turn the following Bisaya sentence to English with correct grammar. Don't put any explanation please:\n\n"${userText}"`;
        messagesToSend = [{ role: "user", parts: [{ text: prompt }] }];
      } else if (currentMode === "letter") {
        const prompt = `Turn this Bisaya input into English in a letter format:\n\n"${userText}"`;
        messagesToSend = [{ role: "user", parts: [{ text: prompt }] }];
      } else {
        const nextHistory = [
          ...chatHistory,
          { role: "user", parts: [{ text: userText }] }
        ];

        const totalChars = JSON.stringify(nextHistory).length;
        if (totalChars > 12000) {
          document.getElementById('loading-message')?.remove();
          appendMessage('ai', "⚠️ Memory full! Please click the Refresh button to reset the conversation.");
          return;
        }

        messagesToSend = nextHistory;
      }

      try {
        const apiKey = "AQ.Ab8" + "RN6IL48P-XVpE" + "FaqPfLPdUHNt-PXUTQ" + "bYtvZ4PiejYv1PrA";

        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: messagesToSend })
          }
        );

        const data = await res.json();
        document.getElementById('loading-message')?.remove();

        if (!res.ok) {
          const errMsg = data?.error?.message || `HTTP ${res.status}`;
          appendMessage('ai', `⚠️ API Error: ${errMsg}`);
          return;
        }

        const aiText =
          data?.candidates?.[0]?.content?.parts?.[0]?.text ||
          "Sorry, I couldn't generate a response.";

        appendMessage('ai', aiText);

        if (currentMode === 'ask') {
          chatHistory.push({ role: "user", parts: [{ text: userText }] });
          chatHistory.push({ role: "model", parts: [{ text: aiText }] });
        }
      } catch (err) {
        console.error(err);
        document.getElementById('loading-message')?.remove();
        appendMessage('ai', "⚠️ Error connecting to Geykson.");
      }
    }
  </script>
</body>
