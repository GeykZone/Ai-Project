<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Talk With Geykson AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #090d16;
      --bg-card: #111827;
      --bg-elevated: #1f2937;
      --bg-chat: #0d1320;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-green: #10b981;
      --bubble-user: linear-gradient(135deg, #2563eb, #1d4ed8);
      --bubble-ai: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #172033 0%, var(--bg-outer) 65%);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-box {
      width: 100%;
      max-width: 720px;
      height: min(860px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 16px 20px;
      background: rgba(17, 24, 39, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .brand-info {
      min-width: 0;
    }

    .brand-info h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .refresh-btn:hover {
      background: #2b3749;
      border-color: rgba(255, 255, 255, 0.16);
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    /* Mode Selector */
    .mode-bar {
      padding: 12px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-chat);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .mode-buttons button {
      padding: 9px 10px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.25;
      transition: all 0.2s ease;
    }

    .mode-buttons button:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .mode-buttons button.active {
      background: var(--accent-green);
      color: #052e16;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
    }

    /* Messages Area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-secondary);
      max-width: 320px;
      padding: 20px;
    }

    .empty-state .emoji {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeSlideIn 0.2s ease-out;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.ai {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-meta {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background: var(--bubble-user);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .message-row.ai .message-bubble {
      background: var(--bubble-ai);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
    }

    /* Typing Dots */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.45; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input Bar */
    .input-wrapper {
      padding: 14px 20px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px 6px 6px 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-container:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      padding: 8px 0;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    button.send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent-blue);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button.send-btn:hover {
      background: var(--accent-blue-hover);
    }

    button.send-btn:active {
      transform: scale(0.97);
    }

    /* Mobile & Small Screens */
    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .chat-box {
        height: 100dvh;
        max-width: 100%;
        border-radius: 0;
        border: none;
      }

      .chat-header {
        padding: 12px 14px;
      }

      .brand-avatar {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }

      .brand-info h2 {
        font-size: 15px;
      }

      .refresh-btn {
        padding: 7px 11px;
        font-size: 12px;
      }

      .mode-bar {
        padding: 8px 12px;
      }

      .mode-buttons {
        gap: 4px;
        padding: 4px;
      }

      .mode-buttons button {
        padding: 8px 6px;
        font-size: 11px;
      }

      #messages {
        padding: 14px;
        gap: 12px;
      }

      .message-row {
        max-width: 88%;
      }

      .message-bubble {
        padding: 10px 14px;
        font-size: 14px;
      }

      .input-wrapper {
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      }

      button.send-btn {
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="chat-header">
      <div class="brand">
        <div class="brand-avatar">🤖</div>
        <div class="brand-info">
          <h2>Geykson Maravillas AI</h2>
          <div class="status-line">
            <span class="status-dot"></span>
            <span id="mode-subtitle">Bisaya &amp; English Assistant</span>
          </div>
        </div>
      </div>
      <button class="refresh-btn" onclick="manualRefresh()" title="Reset conversation">
        <span>🔄</span>
        <span>Refresh</span>
      </button>
    </div>

    <div class="mode-bar">
      <div class="mode-buttons">
        <button onclick="selectMode('translate')" id="btn-translate">Translate Bisaya ➞ English</button>
        <button onclick="selectMode('letter')" id="btn-letter">Letter Format (Bisaya ➞ English)</button>
        <button onclick="selectMode('ask')" id="btn-ask">Ask Anything</button>
      </div>
    </div>

    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="emoji">👋</div>
        <p>Kumusta! Type a message below in Bisaya or English to start chatting.</p>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-container">
        <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
        <button onclick="sendMessage()" class="send-btn">
          <span>Send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    let currentMode = localStorage.getItem('mode') || 'ask';
    const conversationLog = [];

    const systemPrompt = `You are Geykson AI, a helpful and friendly assistant created by Geykson Maravillas.
You fluently understand and speak both Bisaya and English, and can translate or switch between the two when requested — but never add translations unless the user asks.

You were built by Geykson Maravillas — a Certified Salesforce Developer at Posimente and a Stripe Certified Developer.
Only mention this background if you're asked “Who are you?” or “Who built you?”, and avoid repeating it in every reply.

If you're asked about Geykson's hobbies, describe him as someone who loves exploring new ideas, building automations to make life easier, enjoys sports like boxing and basketball, sings, does art, loves cats, motorcycles, and roaming around. Feel free to describe this in a warm, natural way.

Always respond casually and naturally — like a close Bisaya-English speaking friend. Don't include extra explanations or parenthesis translations unless specifically requested by the user.`;

    let chatHistory = [
      { role: "user", parts: [ { text: systemPrompt } ] }
    ];

    function manualRefresh() {
      localStorage.removeItem('mode');
      location.reload();
    }

    function selectMode(mode) {
      localStorage.setItem('mode', mode);
      location.reload();
    }

    function highlightActiveButton() {
      document.querySelectorAll('.mode-buttons button').forEach(btn => btn.classList.remove('active'));
      const btn = document.getElementById('btn-' + currentMode);
      if (btn) btn.classList.add('active');

      const subtitle = document.getElementById('mode-subtitle');
      if (subtitle) {
        const labels = {
          translate: 'Mode: Bisaya ➞ English Translator',
          letter: 'Mode: Formal English Letter',
          ask: 'Mode: Ask Anything (Memory Active)'
        };
        subtitle.textContent = labels[currentMode] || 'Bisaya & English Assistant';
      }
    }

    highlightActiveButton();

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function appendMessage(role, text) {
      document.getElementById('empty-state')?.remove();

      const timestamp = new Date().toLocaleString();
      const shortTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const row = document.createElement('div');
      row.className = 'message-row ' + role;

      const formattedText = escapeHTML(text)
        .replace(/\n/g, '<br>')
        .replace(/(?:^|\n)(\s+)/g, '<br>&nbsp;&nbsp;&nbsp;&nbsp;');

      row.innerHTML = `
        <div class="message-meta">${role === 'user' ? 'You' : 'Geyk'} • ${shortTime}</div>
        <div class="message-bubble">${formattedText}</div>
      `;

      messagesDiv.appendChild(row);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const logEntry = `[${timestamp}] ${role === 'user' ? 'You' : 'Geyk'}: ${text}`;
      conversationLog.push(logEntry);

      // 🔥 Save after every message
      fetch('/save-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: logEntry + "\n"
      }).catch(console.error);
    }

    document.getElementById('user-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const userText = input.value.trim();
      if (!userText) return;

      appendMessage('user', userText);
      input.value = '';

      const loadingRow = document.createElement('div');
      loadingRow.className = 'message-row ai';
      loadingRow.id = 'loading-message';
      loadingRow.innerHTML = `
        <div class="message-meta">Geyk</div>
        <div class="message-bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      messagesDiv.appendChild(loadingRow);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      let messagesToSend;

      if (currentMode === "translate") {
        const prompt = `Turn the following Bisaya sentence to English with correct grammar. Don't put any explanation please:\n\n"${userText}"`;
        messagesToSend = [{ role: "user", parts: [{ text: prompt }] }];
      } else if (currentMode === "letter") {
        const prompt = `Turn this Bisaya input into English in a letter format:\n\n"${userText}"`;
        messagesToSend = [{ role: "user", parts: [{ text: prompt }] }];
      } else {
        const nextHistory = [
          ...chatHistory,
          { role: "user", parts: [{ text: userText }] }
        ];

        const totalChars = JSON.stringify(nextHistory).length;
        if (totalChars > 12000) {
          document.getElementById('loading-message')?.remove();
          appendMessage('ai', "⚠️ Memory full! Please click the Refresh button to reset the conversation.");
          return;
        }

        messagesToSend = nextHistory;
      }

      try {
        const apiKey = "AQ.Ab8" + "RN6IL48P-XVpE" + "FaqPfLPdUHNt-PXUTQ" + "bYtvZ4PiejYv1PrA";

        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: messagesToSend })
          }
        );

        const data = await res.json();
        document.getElementById('loading-message')?.remove();

        if (!res.ok) {
          const errMsg = data?.error?.message || `HTTP ${res.status}`;
          appendMessage('ai', `⚠️ API Error: ${errMsg}`);
          return;
        }

        const aiText =
          data?.candidates?.[0]?.content?.parts?.[0]?.text ||
          "Sorry, I couldn't generate a response.";

        appendMessage('ai', aiText);

        if (currentMode === 'ask') {
          chatHistory.push({ role: "user", parts: [{ text: userText }] });
          chatHistory.push({ role: "model", parts: [{ text: aiText }] });
        }
      } catch (err) {
        console.error(err);
        document.getElementById('loading-message')?.remove();
        appendMessage('ai', "⚠️ Error connecting to Geykson.");
      }
    }
  </script>
</body>
</html>
